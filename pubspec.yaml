name: md3music
description: "MD3Music - Music player with Material Design 3"
publish_to: 'none'
version: 6.0.1+48

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # just_audio 0.10.6 本地 fork：注入可拦截 AudioSink 的 RenderersFactory（USB 独占输出）
  just_audio:
    path: third_party/just_audio
  audio_session: ^0.1.18
  http: ^1.2.1
  # TV 构建焦点遍历引擎（fluttercandies/dpad），仅 --dart-define=MD3_TV=true 时生效，正常构建树摇剔除
  dpad: ^3.0.0
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  sensors_plus: ^7.1.0
  crypto: ^3.0.3
  flutter_cache_manager: ^3.4.1
  shared_preferences: ^2.5.0
  permission_handler: ^12.0.0
  record: ^6.1.1
  path_provider: ^2.1.0
  quick_actions: ^1.0.7
  sqflite: 2.3.3+1
  intl: ^0.20.2
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.1
  ffi: ^2.1.0
  palette_generator: ^0.3.3+7
  dynamic_color: ^1.7.0
  material_color_utilities: ^0.13.0
  audio_metadata_reader: ^1.4.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  # MV 弹幕渲染层：CustomPainter 直绘，纯 Dart（无原生代码，不影响 Android 打包链路）
  # MIT 许可，与本项目 AGPL-3.0 兼容
  canvas_danmaku: ^0.3.3
  # Windows 桌面实现（均只声明 windows 平台，Android 完全不编译/注册，零影响）
  just_audio_windows: ^0.2.3   # just_audio 的 Windows 实现（WinRT MediaPlayer）
  video_player_win: ^3.2.2     # video_player 的 Windows 实现（Media Foundation）
  dlna_dart: ^0.1.0
  webview_flutter: ^4.10.0
  flutter_secure_storage: ^10.3.1
  # 原生 Toast 提示（替代 SnackBar 通知）；10.0.0 起 compileSdk 满足项目 36 要求
  fluttertoast: ^10.0.0
  # TTML 歌词解析：Apple Music 风格 XML（Timed Text Markup Language）
  xml: ^6.5.0
  m3e_core: ^1.1.4
  # Material 库已解耦为独立包；m3e_core 1.1.0+ 要求 Flutter >=3.47.0 且依赖
  # material_ui ^1.3.0。注意 material_ui 声明的 flutter ">=3.44.0" 不准确：
  # 1.3.0 用了 @awaitNotRequired，该符号只在 3.47+ 的 foundation.dart
  # 导出列表中提供，3.44.x 上会编译失败（Undefined name 'awaitNotRequired'）。
  material_ui: ^1.3.0
  # AM 播放器传输按钮：路径级矢量图标形变（play↔pause 连续 morph + prev/next 描边动画）
  # 纯 Dart、零外部依赖，仅需自带 24x24 描边 SVG
  iconic_morph: ^1.9.0
  # 网络类型检测（WiFi / 移动网络）：音质按网络分别设置
  connectivity_plus: ^7.0.0
  # 图片选择（外部歌单截图导入）
  image_picker: ^1.1.2
  # Windows 原生文件/目录选择（背景图、字体与本地音乐目录）
  file_selector: ^1.1.0
  # 诊断日志导出：系统分享面板（Android ACTION_SEND / Windows 系统分享），自带 FileProvider
  share_plus: ^13.3.0
  # 诊断日志导出：纯 Dart zip 打包（无原生代码，跨平台）
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  analyzer: ^10.2.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - LICENSE
    - assets/web/
  shaders:
    - shaders/depth_parallax.frag
