name: Update Star History Chart

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）更新一次
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Star History SVG
        run: |
          # 尝试获取 star-history SVG，超时 60 秒
          curl -sfL --max-time 60 \
            "https://api.star-history.com/svg?repos=zzyoxml/md3Music&type=Date" \
            -o img/star-history.svg

          # 检查文件是否有效（SVG 应以 <svg 开头）
          if [ ! -s img/star-history.svg ] || ! head -c 5 img/star-history.svg | grep -q '<svg'; then
            echo "SVG fetch failed or invalid, skipping commit"
            rm -f img/star-history.svg
            exit 0
          fi

          echo "SVG fetched successfully, size: $(wc -c < img/star-history.svg) bytes"

      - name: Commit
        run: |
          if [ ! -f img/star-history.svg ]; then
            echo "No SVG to commit, exiting"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add img/star-history.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update star history chart"
            git push
          fi
