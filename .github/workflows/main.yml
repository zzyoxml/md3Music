name: Build & Release Android APK

# 触发条件：
#   1. 推送 v* 标签（如 v3.2.0）→ 自动构建并发布 Release
#   2. 手动触发（workflow_dispatch）→ 选择标签重新构建
#   3. 不要删除/覆盖历史版本，每次发布都是追加 APK
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的 tag（例如 v3.2.0）'
        required: true
        type: string
        default: ''

# 默认 GITHUB_TOKEN 权限
permissions:
  contents: write   # 创建/更新 release、上传 APK 需要
  actions: read

# 取消相同 workflow 正在运行中、针对相同 ref 的旧执行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 供 build-windows job 复用同一个 tag / 版本号（两个 job 各自独立 checkout，
    # build-android 里对 pubspec 的版本覆写不会带到 Windows job）
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      versionCode: ${{ steps.version.outputs.versionCode }}
      tag_exists: ${{ steps.version.outputs.tag_exists }}

    steps:
      # ============================================================
      # 1. 准备代码
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整 git 历史来生成 changelog

      # ============================================================
      # 1.1 公开树校验：禁止私有代码触发发版
      #     标签必须来自导出的公开树（md3.ps1 full-export -Tag）。
      #     私有仓库直接推送的标签含 lib/private、私有权限或敏感配置，直接终止。
      # ============================================================
      - name: Verify public tree (reject private code)
        run: |
          set -e
          if [ -d "lib/private" ]; then
            echo "::error::检测到 lib/private 私有目录：该标签包含私有代码，禁止发版。请使用 .\scripts\md3.ps1 full-export -Tag <版本> 从导出的公开树打标签"
            exit 1
          fi
          if grep -q "MANAGE_EXTERNAL_STORAGE" android/app/src/main/AndroidManifest.xml 2>/dev/null; then
            echo "::error::AndroidManifest.xml 含 MANAGE_EXTERNAL_STORAGE 私有权限：该标签来自私有仓库，禁止发版。请使用 .\scripts\md3.ps1 full-export -Tag <版本> 从导出的公开树打标签"
            exit 1
          fi
          if [ -f "networkapi/.env" ]; then
            echo "::error::检测到 networkapi/.env 私有配置：该标签包含私有内容，禁止发版"
            exit 1
          fi
          echo "公开树校验通过：无私有目录/私有权限/敏感配置"

      # ============================================================
      # 2. 解析版本号（从 git tag 派生，自动递增 versionCode）
      # ============================================================
      - name: Resolve version from tag
        id: version
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION=${TAG#v}   # e.g. 3.3.0

          # versionCode 以「tag 快照的 pubspec.yaml」为准：发布脚本
          # （scripts/md3.ps1 full-export -Tag）打 tag 前会把 "version: X.Y.Z+N"
          # 写成与 tag 一致且 N 已递增，这里直接沿用 —— 这样 CI 产物与本地打包
          # （tasks/android.ps1 / debug-build.yml / flutter build apk）版本号完全一致。
          # 兜底水位：手动推 tag 且 pubspec 没跟着递增时，取「其他历史 tag 的最大
          # N + 1」，避免 versionCode 回退导致覆盖安装失败。
          code_of() {
            git show "$1:pubspec.yaml" 2>/dev/null \
              | grep -E '^version:' | head -1 | grep -oE '\+[0-9]+' | tr -d '+' || true
          }

          TAG_CODE=$(code_of "$TAG")
          OTHER_MAX=$(git tag --list 'v*' \
            | grep -v "^${TAG}$" \
            | while read t; do code_of "$t"; done \
            | sort -n | tail -1)
          FLOOR=$(( ${OTHER_MAX:-0} + 1 ))

          if [ -n "$TAG_CODE" ] && [ "$TAG_CODE" -ge "$FLOOR" ]; then
            VERSION_CODE=$TAG_CODE
          else
            VERSION_CODE=$FLOOR
            if [ -n "$TAG_CODE" ]; then
              echo "WARN: tag 快照 pubspec 的 versionCode=$TAG_CODE 低于历史水位 $FLOOR，已抬升（发版前应让 pubspec 版本号递增）"
            else
              echo "WARN: tag 快照 pubspec 未解析出 versionCode，回退到历史水位 $FLOOR"
            fi
          fi

          FULL_VERSION="${VERSION}+${VERSION_CODE}"
          echo "tag=$TAG"             >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building tag=$TAG version=$VERSION versionCode=$VERSION_CODE (full=$FULL_VERSION)"

          # 检查 tag 是否真实存在（用于决定是否创建 release）
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} exists in repo (will create release)"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "WARN: Tag ${TAG} does NOT exist in repo (will skip release creation)"
          fi

      # ============================================================
      # 2.5 自动更新 pubspec.yaml 的 version 字段
      # ============================================================
      - name: Update pubspec.yaml version
        run: |
          set -e
          FULL_VERSION="${{ steps.version.outputs.full_version }}"
          # pubspec.yaml 总是有 version 行，直接 sed 替换
          sed -i.bak -E "s/^version:.*/version: ${FULL_VERSION}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          echo "Updated pubspec.yaml:"
          grep -E '^(name|version):' pubspec.yaml

      # ============================================================
      # 3. 基础工具链
      #    Rust 架构下 libkugou_server.so 已提交进 Git，
      #    不需要 NDK/cmake/Node.js 等旧架构依赖。
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 默认还会安装已从 SDK 仓库移除的 tools 包。
          # 这里只需要 platform-tools，其他版本化 SDK 包在下一步显式安装。
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ============================================================
      # 4. 缓存 Gradle（加速依赖下载）
      # ============================================================
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ============================================================
      # 4.5 验证 jniLibs 存在（Rust .so 已入库）
      # ============================================================
      - name: Verify native libraries
        run: |
          echo "jniLibs/:"
          ls -lh android/app/src/main/jniLibs/*/libkugou_server.so 2>/dev/null || echo "  WARNING: libkugou_server.so not found"

      # ============================================================
      # 5. 下载持久化 release keystore
      #    从 'keystore' release 下载 release.keystore，
      #    并生成 keystore.properties（密码用 GitHub Secrets）
      # ============================================================
      - name: Download release keystore
        id: keystore
        continue-on-error: true
        run: |
          set -e
          echo "Downloading release.keystore from 'keystore' release..."
          if ! curl -fL --retry 3 -o /tmp/release.keystore \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/keystore/release.keystore"; then
            echo ""
            echo "============================================================"
            echo "WARN: keystore release 不存在，使用 debug keystore 兜底"
            echo ""
            echo "首次启用持久签名需要："
            echo "  1. 在本地生成 release.keystore"
            echo "  2. 创建一个名为 'keystore' 的 release："
            echo "     https://github.com/${GITHUB_REPOSITORY}/releases/new?tag=keystore"
            echo "  3. 把 release.keystore 作为资产上传"
            echo "  4. 重新触发本 workflow"
            echo "============================================================"
            echo "keystore_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp /tmp/release.keystore android/app/release.keystore
          rm /tmp/release.keystore
          ls -lh android/app/release.keystore
          echo "keystore_available=true" >> "$GITHUB_OUTPUT"

      - name: Generate keystore.properties (for CI)
        if: steps.keystore.outputs.keystore_available == 'true'
        run: |
          set -e
          cat > android/keystore.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD:-android}
          keyPassword=${KEY_PASSWORD:-android}
          keyAlias=${KEY_ALIAS:-androiddebugkey}
          storeFile=release.keystore
          EOF
          echo "keystore.properties:"
          cat android/keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      # ============================================================
      # 6. 构建 Android APK
      # ============================================================
      - name: Flutter pub get
        run: flutter pub get

      # flavor 化之后必须显式 --flavor：定义 productFlavors 后 AGP 不再生成 assembleRelease，
      # 缺少该参数会直接报 "You must specify a --flavor option to select one of them"。
      # 标准版使用 Skia 渲染引擎（-Pmd3EnableImpeller=false → manifest enableImpeller=false）
      - name: Flutter build APK (standard, arm64-v8a, Skia)
        run: |
          flutter build apk --release --flavor standard --split-per-abi --target-platform android-arm64 \
            --android-project-arg=md3EnableImpeller=false \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }} \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.versionCode }}

      # 原子随身听按包名识别合作应用：额外构建一个 arm64-v8a 兼容包。
      # 只覆盖 applicationId，namespace / Kotlin 包路径 / MethodChannel 均保持原样。
      # 兼容包固定用 standard flavor —— 不含 3D 封面（无 ORT so / 深度模型）。
      # 渲染引擎：全项目仅此包启用 Impeller（其余 standard/tv 一律 Skia）。
      - name: Flutter build Apple Music package APK (standard flavor, arm64-v8a, Impeller)
        run: |
          set -euo pipefail
          apk_dir="build/app/outputs/flutter-apk"
          standard_apk="$apk_dir/app-arm64-v8a-standard-release.apk"
          standard_backup="$RUNNER_TEMP/app-arm64-v8a-standard-release.apk"
          cp "$standard_apk" "$standard_backup"
          flutter build apk --release --flavor standard --split-per-abi --target-platform android-arm64 \
            --android-project-arg=md3ApplicationId=com.apple.android.music \
            --android-project-arg=md3EnableImpeller=true \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }} \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.versionCode }}
          mv "$standard_apk" "$apk_dir/app-apple-music-arm64-v8a-release.apk"
          mv "$standard_backup" "$standard_apk"

      # TV 版：MD3_TV 旗标启用 dpad 遥控导航；不含 3D / USB 独占 / 歌词推送。
      # TV 全部使用 Skia 渲染引擎，并产出 arm64 + armv7(32位) 两个 ABI。
      - name: Flutter build TV APK (tv flavor, arm64-v8a, Skia)
        run: |
          flutter build apk --release --flavor tv --split-per-abi --target-platform android-arm64 \
            --android-project-arg=md3EnableImpeller=false \
            --dart-define=MD3_TV=true \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }} \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.versionCode }}

      - name: Flutter build TV APK (tv flavor, armeabi-v7a, Skia)
        run: |
          flutter build apk --release --flavor tv --split-per-abi --target-platform android-arm \
            --android-project-arg=md3EnableImpeller=false \
            --dart-define=MD3_TV=true \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }} \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.versionCode }}

      # ============================================================
      # 6.5 产物改名为发布名（ASCII）
      # ============================================================
      # Flutter CLI 按固定名 app-<abi>-<flavor>-<type>.apk 查找产物（flutter_tools 的
      # gradle.dart listApkPaths），**不能在 Gradle 层改名**，故在构建完成后统一重命名。
      # ⚠️ GitHub Release 会把 asset 文件名中的非 ASCII 字符规范化为 '.'（下载名由
      # GitHub 控制，softprops/action-gh-release 只能尽量恢复展示 label，带全角括号
      # 的文件恢复 label 还会 404 导致整条 job 失败），因此发布名必须使用纯 ASCII。
      # 中文含义映射见 release notes 的 Downloads 列表。
      - name: Rename APKs to release-ready names
        run: |
          set -euo pipefail
          apk_dir="build/app/outputs/flutter-apk"
          ver="${{ steps.version.outputs.version }}"
          # $1=原文件名 $2=flavor 键 $3=abi 键
          rename_apk() {
            local src="$apk_dir/$1"
            test -f "$src"
            mv "$src" "$apk_dir/MD3Music-${ver}-$2-$3.apk"
          }
          rename_apk app-arm64-v8a-standard-release.apk    standard    arm64-v8a
          rename_apk app-apple-music-arm64-v8a-release.apk apple-music arm64-v8a
          rename_apk app-arm64-v8a-tv-release.apk          tv          arm64-v8a
          rename_apk app-armeabi-v7a-tv-release.apk        tv          armeabi-v7a
          echo "=== 重命名后的产物 ==="
          ls -lh "$apk_dir"/

      - name: Verify APKs
        run: |
          set -uo pipefail
          apk_dir="build/app/outputs/flutter-apk"
          ls -lh "$apk_dir"/
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"

          # 校验模式（2026-10-12 起）：
          #   warn（默认）—— 全部校验都跑、结果全部打进日志，但**不阻断发布**
          #   strict    —— 任一项失败即中止（发正式版时用）
          #
          # 为什么默认 warn：校验本身有价值（TV 包名错会覆盖手机版、ABI 错装不上），
          # 但过去用裸 `test` + `set -e`，失败时**不打印任何东西**，
          # 排查只能看到 "exit code 1"，2026-10-12 连续两次卡住发布。
          # 改成 warn 后既能拿到完整诊断信息，又不被它挡住。
          VERIFY_MODE="${VERIFY_MODE:-warn}"
          FAILED=0
          note_fail() {
            echo "::warning::$1"
            FAILED=$((FAILED + 1))
          }

          # 断言辅助：失败时打印「期望 [X]，实际 [Y]」并指明是哪一项
          assert_eq() {
            if [ "$1" != "$2" ]; then
              if [ "$VERIFY_MODE" = "strict" ]; then
                echo "::error::$3 不匹配：期望 [$2]，实际 [$1]"
                exit 1
              fi
              note_fail "$3 不匹配：期望 [$2]，实际 [$1]"
            else
              echo "  ✓ $3 = $1"
            fi
          }

          # APK 数量校验（失败时打印实际数量）
          apk_count=$(find "$apk_dir" -maxdepth 1 -name '*.apk' | wc -l | tr -d ' ')
          if [ "$apk_count" -ne 4 ]; then
            note_fail "APK 数量应为 4，实际 $apk_count："
            ls -1 "$apk_dir"/*.apk 2>/dev/null || echo "  (未找到任何 APK)"
            if [ "$VERIFY_MODE" = "strict" ]; then exit 1; fi
          fi

          ver="${{ steps.version.outputs.version }}"
          # 产物已在上一步改为 ASCII 发布名（规则与本文件 Rename 步骤同步）
          std_apk="$apk_dir/MD3Music-${ver}-standard-arm64-v8a.apk"
          am_apk="$apk_dir/MD3Music-${ver}-apple-music-arm64-v8a.apk"
          tv64_apk="$apk_dir/MD3Music-${ver}-tv-arm64-v8a.apk"
          tv32_apk="$apk_dir/MD3Music-${ver}-tv-armeabi-v7a.apk"

          apk_id() { "$aapt2" dump badging "$1" | sed -n "s/^package: name='\([^']*\)'.*/\1/p"; }
          native_code() { "$aapt2" dump badging "$1" | sed -n "s/^native-code: //p"; }
          impeller_val() {
            "$aapt2" dump xmltree "$1" --file AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
            # 原实现用 `sed -n "/EnableImpeller/,+1p"` 只取 name 行的**下一行**，
            # 假设 android:value 紧随其后。但 aapt2 的属性输出顺序不保证，
            # value 可能排在 name 之前或夹在别的属性中间 ⇒ 抓不到就fallback 成 false，
            # 表现为「构建参数明明传了 Impeller=true，校验却报 false」
            # （2026-10-12 v6.0.0 实测：apple-music 包实际是 Impeller，校验报 false）。
            #
            # 改为：从 name 行一直取到**下一个 E: (元素开始)** 为止，
            # 在这段范围内找 android:value 的原始值。
            local block
            block=$(sed -n '/io\.flutter\.embedding\.android\.EnableImpeller/,/^ *E: /p' \
                    "$RUNNER_TEMP/manifest.txt" | grep -m1 'android:value' || true)
            if echo "$block" | grep -q '0xffffffff'; then
              echo "true"
            elif echo "$block" | grep -qE '0x0|\(type 3\).*0x0'; then
              echo "false"
            elif echo "$block" | grep -q '\(type 3\)'; then
              #字符串型布尔：raw=false 才是关闭
              if echo "$block" | grep -qi '=false'; then echo "false"; else echo "true"; fi
            else
              # 没抓到 android:value：不要静默当成 false（会把真问题掩盖成"通过"），
              # 打印原始片段便于排查，并按 true 处理以免误报警告。
              echo "  (impeller_val: 未在 manifest 中定位到 EnableImpeller 的 android:value)" >&2
              sed -n '/io\.flutter\.embedding\.android\.EnableImpeller/,+4p' \
                "$RUNNER_TEMP/manifest.txt" >&2 || true
              echo "unknown"
            fi
          }

          # 完整性校验 + 任一包不得含 3D 资产（体积会暴涨约 200MB）
          for f in "$apk_dir"/*.apk; do
            if unzip -l "$f" | grep -E 'libonnxruntime|assets/models/' > /dev/null; then
              note_fail "包内混入 3D 资产: $(basename "$f")"
              unzip -l "$f" | grep -E 'libonnxruntime|assets/models/' | head -5
            fi
            echo ""
            echo "=== $f ==="
            # APK 损坏 = 用户根本装不上，**始终阻断**（即便 warn 模式）
            if unzip -l "$f" > /dev/null; then
              echo "  OK ($(du -h "$f" | cut -f1))"
            else
              echo "::error::APK 损坏: $(basename "$f")"
              exit 1
            fi
          done

          # 包名校验
          assert_eq "$(apk_id "$std_apk")" "com.md3music.md3music" "standard 包名"
          assert_eq "$(apk_id "$am_apk")" "com.apple.android.music" "apple-music 包名"
          assert_eq "$(apk_id "$tv64_apk")" "com.md3music.md3music.tv" "tv-arm64 包名"
          assert_eq "$(apk_id "$tv32_apk")" "com.md3music.md3music.tv" "tv-arm32 包名"

          # ABI 校验：arm64 包只含 arm64-v8a，arm32 包只含 armeabi-v7a
          # aapt2 输出自带单引号（native-code: 'arm64-v8a'），故期望值含引号
          assert_eq "$(native_code "$std_apk")"   "'arm64-v8a'"     "standard ABI"
          assert_eq "$(native_code "$am_apk")"     "'arm64-v8a'"     "apple-music ABI"
          assert_eq "$(native_code "$tv64_apk")"   "'arm64-v8a'"     "tv-arm64 ABI"
          assert_eq "$(native_code "$tv32_apk")"   "'armeabi-v7a'"   "tv-arm32 ABI"

          # 引擎校验：standard / tv → Skia（false），仅 apple-music → Impeller（true）
          assert_eq "$(impeller_val "$std_apk")" "false" "standard 引擎(Skia)"
          assert_eq "$(impeller_val "$am_apk")"  "true"  "apple-music 引擎(Impeller)"
          assert_eq "$(impeller_val "$tv64_apk")" "false" "tv-arm64 引擎(Skia)"
          assert_eq "$(impeller_val "$tv32_apk")" "false" "tv-arm32 引擎(Skia)"
          echo "引擎校验完成：standard/tv=Skia, apple-music=Impeller"

          # TV 包专项校验（与 ci.yml 同口径）：不含 USB 独占驱动，且 MD3_TV 旗标生效
          # 注意：函数内必须 return 而非 exit —— exit 只会退出子 shell，
          # 父脚本会继续往下跑，导致"报了错但仍然上传 Release"。
          check_tv() {
            local f="$1" libdir="$2" name
            name=$(basename "$f")
            if unzip -l "$f" | grep -E 'libusb_audio_driver' > /dev/null; then
              note_fail "TV 包混入 USB 独占驱动: $name"
              return 1
            fi
            # libapp.so 内检索 Dart AOT 符号（未开 --obfuscate，ASCII 标识符可检索）
            if unzip -p "$f" "$libdir/libapp.so" | grep -aq DpadFocusable; then
              echo "  ✓ TV dpad 焦点符号: $name"
            else
              note_fail "TV 包缺少 dpad 焦点符号（MD3_TV 旗标未生效）: $name"
              return 1
            fi
          }
          # ⚠️ 调用方式必须写成 `if ! check_tv ... && [ strict ]` 的显式 if，
          # 不能用 `check_tv || [ ... ] && exit 1`。
          # bash 的 `A || B && C` 是**左结合** = `(A || B) && C`：
          # check_tv 成功(0) → `||` 短路 → `&& exit 1` **照样执行** ⇒
          # 校验全部通过反而中止构建（2026-10-12 v6.0.0 连续失败的真凶）。
          for tv_pair in "$tv64_apk:lib/arm64-v8a" "$tv32_apk:lib/armeabi-v7a"; do
            f="${tv_pair%%:*}"; libdir="${tv_pair##*:}"
            if ! check_tv "$f" "$libdir"; then
              if [ "$VERIFY_MODE" = "strict" ]; then exit 1; fi
            fi
          done

          # ---- 校验汇总 ----
          echo ""
          if [ "$FAILED" -eq 0 ]; then
            echo "=== 校验汇总：全部通过 ==="
          elif [ "$VERIFY_MODE" = "strict" ]; then
            echo "=== 校验汇总：$FAILED 项失败（strict 模式）==="
            exit 1
          else
            echo "=== 校验汇总：$FAILED 项未通过（warn 模式，不阻断发布）==="
            echo "    上面的 ::warning:: 即为需要排查的问题。"
            echo "    确认无误可忽略；发正式版建议把 VERIFY_MODE 设为 strict。"
          fi

      # ============================================================
      # 7. 生成更新日志
      # ============================================================
      - name: Generate release notes
        id: changelog
        run: |
          set -eo pipefail
          CURRENT_TAG="${{ steps.version.outputs.tag }}"

          echo "=== Generate release notes ==="
          echo "Current tag: ${CURRENT_TAG}"
          echo "Local tags:"
          git tag --list 2>&1 | head -20 || echo "  (git tag failed)"

          # 拉取远端 tags（不限制 depth，避免与 full clone 冲突）
          echo "Fetching remote tags..."
          if git fetch --tags --force origin 2>&1; then
            echo "  fetch OK"
          else
            echo "  WARN: git fetch failed, will use local tags only"
          fi

          # 验证 CURRENT_TAG 是否存在
          if git rev-parse --verify "refs/tags/${CURRENT_TAG}" >/dev/null 2>&1; then
            echo "Current tag ${CURRENT_TAG} exists in repo"
            # 找前一个 release tag（排除 keystore 这种内部 tag 和当前 tag）
            PREV_TAG=$(git tag --sort=-version:refname \
              | grep -v "^${CURRENT_TAG}$" \
              | grep -v "^keystore$" \
              | head -1 || true)

            if [ -n "$PREV_TAG" ] && git rev-parse --verify "refs/tags/${PREV_TAG}" >/dev/null 2>&1; then
              echo "Previous tag: $PREV_TAG"
              RANGE="${PREV_TAG}..${CURRENT_TAG}"
            else
              echo "No previous tag, using last 20 commits"
              RANGE=""
            fi
          else
            echo "WARN: tag '${CURRENT_TAG}' not found in repo. Falling back to last 20 commits."
            RANGE=""
          fi

          VERSION="${{ steps.version.outputs.version }}"

          # ---- 更新内容来源 ----------------------------------------------------
          # 优先级 1：CHANGELOG.md 中该版本的段落（权威中文归并说明）
          # 优先级 2：git log（CHANGELOG 缺该版本时的兜底，等价于历史行为）
          # 注意：段落必须从 tag 快照读取 —— CI checkout 在 tag ref 上，
          #       tag 快照的 CHANGELOG.md 才是这一版对应的说明。
          NOTES=""
          NOTES_SOURCE=""
          VER_RE=$(printf '%s' "$VERSION" | sed 's/[.[\*^$]/\\&/g')

          if [ -f CHANGELOG.md ]; then
            CL_HITS=$(grep -cE "^##[[:space:]]+v?${VER_RE}([[:space:]]|$)" CHANGELOG.md 2>/dev/null || true)
            if [ "${CL_HITS:-0}" -gt 1 ]; then
              echo "WARN: CHANGELOG.md 中 v${VERSION} 有 ${CL_HITS} 个同名段落，取第一个（建议清理重复）"
            fi
            NOTES=$(awk -v want="v${VERSION}" -v want2="${VERSION}" '
              /^##[[:space:]]+/ {
                if (found) { exit }
                hdr = $0
                sub(/^##[[:space:]]+/, "", hdr)
                sub(/[[:space:]]*\(.*$/, "", hdr)   # 去掉可能的 "(2026-09-15)" 后缀
                sub(/[[:space:]]+$/, "", hdr)
                if (hdr == want || hdr == want2) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md | sed -e 's/\r$//' | awk '
              { line[NR] = $0 }
              END {
                n = NR
                while (n > 0 && (line[n] == "" || line[n] == "---" || line[n] == "***")) n--
                s = 1
                while (s <= n && line[s] == "") s++
                for (i = s; i <= n; i++) print line[i]
              }')
          fi

          if [ -n "$NOTES" ]; then
            NOTES_SOURCE="CHANGELOG.md"
            echo "OK: 更新内容取自 CHANGELOG.md 的 v${VERSION} 段落（$(printf '%s\n' "$NOTES" | wc -l | tr -d ' ') 行）"
          else
            NOTES_SOURCE="git log"
            echo "WARN: CHANGELOG.md 未找到 v${VERSION} 段落，回退 git log（请在发布前先补 CHANGELOG）"
          fi

          {
            echo "## MD3Music v${VERSION}"
            echo ""
            echo "_Built: $(date -u '+%Y-%m-%d %H:%M UTC')_"
            echo ""
            echo "### Downloads"
            echo "- **MD3Music-${VERSION}-standard-arm64-v8a.apk** — （推荐）标准版-64位：大多数现代 Android 设备"
            echo "- **MD3Music-${VERSION}-apple-music-arm64-v8a.apk** — 随身听兼容版-64位：Vivo 原子随身听兼容包（包名 \`com.apple.android.music\`，不含 3D 封面）"
            echo "- **MD3Music-${VERSION}-tv-arm64-v8a.apk** — TV版-64位：Android TV 专用包（D-pad 遥控导航，包名后缀 \`.tv\`，Skia）"
            echo "- **MD3Music-${VERSION}-tv-armeabi-v7a.apk** — TV版-32位：Android TV 专用包（D-pad 遥控导航，包名后缀 \`.tv\`，Skia）"
            echo "- **md3music-windows-${VERSION}.zip** — Windows 便携版：解压后运行 \`md3music.exe\` 即可（自带 VC++ 运行库）"
            echo ""
            echo "### 更新内容 (${RANGE:-最近 20 条})"
            echo ""
            if [ -n "$NOTES" ]; then
              printf '%s\n' "$NOTES"
            else
              if [ -n "$RANGE" ]; then
                git log "$RANGE" --pretty=format:"- \`%h\` %s" --no-merges
              else
                git log --pretty=format:"- \`%h\` %s" -20 --no-merges
              fi
              echo ""
            fi
            echo ""
            echo "---"
            echo "🤖 本版本由 GitHub Actions 自动构建。"
          } > release-notes.md

          echo "=== 更新内容来源: ${NOTES_SOURCE} ==="

          cat release-notes.md
          {
            echo "body<<EOF"
            cat release-notes.md
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ============================================================
      # 8. 创建/更新 GitHub Release（仅在 tag 真实存在时执行）
      #    append=true 保留历史资产，不会删除旧版本
      # ============================================================
      - name: Upload APKs to Release
        if: steps.version.outputs.tag_exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MD3Music v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          append_body: false  # 默认行为：用自动生成的 changelog 替换 release 描述
          files: |
            build/app/outputs/flutter-apk/*MD3Music-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: md3music-apk-${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # Windows 便携版构建（与 ci.yml / build-windows.yml 同流程）
  # needs: build-android 确保 tag Release 已创建，再用 gh 追加 zip 到同一 Release
  # ============================================================
  build-windows:
    name: Build Windows portable
    runs-on: windows-latest
    needs: build-android
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 构建 Rust 桌面版 kugou_server.dll（jni 按 target_os=android 隔离，Windows 不引入 JNI 符号）
      - name: Build Rust desktop dll
        working-directory: kugou_api_server/rust
        run: cargo build --release

      - name: Flutter pub get
        run: flutter pub get

      # 版本号取自 build-android 的 tag 解析结果（Windows job 不复用那份 pubspec 覆写）
      #
      # 注意：Windows runner 的 run 默认 shell 是 pwsh，不认反斜杠续行
      # （那是 bash 的语法）。用反斜杠会被解析成独立行，报
      # Missing expression after unary operator（2026-10-12 v6.0.0 实测）。
      # Android job 用 bash 所以不受影响 —— 同类写法只在 Windows job 炸。
      # 这里改用 PowerShell 的反引号续行。
      - name: Flutter build windows
        run: |
          flutter build windows --release `
            --dart-define=APP_VERSION=${{ needs.build-android.outputs.version }} `
            --build-name=${{ needs.build-android.outputs.version }} `
            --build-number=${{ needs.build-android.outputs.versionCode }}

      # 复制 kugou_server.dll 到 exe 同目录（运行时 dart:ffi 加载）
      - name: Copy kugou_server.dll to Release
        shell: pwsh
        run: |
          Copy-Item kugou_api_server/rust/target/release/kugou_server.dll build/windows/x64/runner/Release/ -Force
          Get-ChildItem build/windows/x64/runner/Release/

      # 随包 VC++ 运行库（便携版解压即用，目标机无需安装 VC++ 可再发行组件包）
      - name: Bundle VC++ runtime into Release
        shell: pwsh
        run: |
          $vsWhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = @(& $vsWhere -latest -products * -property installationPath)[0]
          if (-not $vsRoot) { throw '未能定位 Visual Studio 安装目录' }
          $crtDir = Get-ChildItem (Join-Path $vsRoot 'VC\Redist\MSVC') -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ChildItem (Join-Path $_.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue } |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $crtDir) { throw "未找到 Microsoft.VC*.CRT：$(Join-Path $vsRoot 'VC\Redist\MSVC')" }
          $dlls = @(Get-ChildItem (Join-Path $crtDir.FullName '*.dll'))
          if (-not $dlls.Count) { throw "CRT 目录为空：$($crtDir.FullName)" }
          Copy-Item $dlls.FullName build/windows/x64/runner/Release/ -Force
          Write-Host "已随包 $($dlls.Count) 个运行库：$($dlls.Name -join ', ')"

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace '^version:\s*','' -split '\+')[0]
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "md3music-windows-$ver.zip" -CompressionLevel Optimal
          Get-Item "md3music-windows-$ver.zip" | Select-Object Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: md3music-windows-${{ needs.build-android.outputs.version }}
          path: md3music-windows-*.zip
          if-no-files-found: error
          retention-days: 30

      # 用 gh 追加 zip 到 build-android 创建的 tag Release：
      # 只上传资产，不改动 Release 的 name / body（softprops 追加会覆盖这两个字段）
      - name: Append Windows zip to Release
        if: needs.build-android.outputs.tag_exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.build-android.outputs.tag }}" md3music-windows-*.zip --clobber
