name: Debug Build & Test

# 手动触发：构建 debug APK 用于无线 ADB 测试
# debug APK 保留调试符号 + 可抓取 logcat 日志
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        type: choice
        options:
          - debug
          - release
        default: 'debug'
      notes:
        description: '构建说明（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build Android ${{ matrix.package }} ${{ inputs.build_type == 'release' && 'Release' || 'Debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - package: standard
            application_id: com.md3music.md3music
          - package: apple-music
            application_id: com.apple.android.music

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android@v3 默认还会安装已从 SDK 仓库移除的 tools 包。
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "cmdline-tools;latest" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Flutter 构建 APK
      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter build APK
        run: |
          set -euo pipefail
          flutter build apk --${{ inputs.build_type }} --flavor standard --split-per-abi \
            --target-platform android-arm64 \
            --android-project-arg=md3ApplicationId=${{ matrix.application_id }}

      # ============================================================
      # 产物改名为中文（便于区分）
      # ============================================================
      # 命名规则与 scripts/lib/common.ps1 的 Get-ApkDisplayName 必须同步。
      # 两种包名均只构建 arm64-v8a。
      - name: Rename APK to Chinese display name
        run: |
          set -euo pipefail
          apk_dir="build/app/outputs/flutter-apk"
          ver="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d+ -f1)"
          if [[ "${{ matrix.package }}" == "apple-music" ]]; then
            flavor_cn="随身听兼容版"
          else
            flavor_cn="标准版"
          fi
          src="$apk_dir/app-arm64-v8a-standard-${{ inputs.build_type }}.apk"
          if [[ ! -f "$src" ]]; then echo "::error::未找到构建产物 $src"; exit 1; fi
          dst="$apk_dir/MD3音乐-${ver}-${flavor_cn}-64位-${{ inputs.build_type }}.apk"
          mv "$src" "$dst"
          {
            echo "APK_FILE=$(basename "$dst")"
            echo "FLAVOR_CN=${flavor_cn}"
          } >> "$GITHUB_ENV"
          echo "=== 重命名后的产物 ==="
          ls -lh "$apk_dir"/

      - name: Verify APK
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/${APK_FILE}"
          ls -lh build/app/outputs/flutter-apk/
          if ! unzip -l "$apk" > /dev/null; then
            echo "::error::产物损坏：$apk"; exit 1
          fi
          echo "OK ($(du -h "$apk" | cut -f1))"
          aapt2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test "$("$aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")" = "${{ matrix.application_id }}"
          # 校验最终 APK 只含 arm64-v8a，并已启用 Impeller。
          test "$("$aapt2" dump badging "$apk" | sed -n "s/^native-code: //p")" = "'arm64-v8a'"
          "$aapt2" dump xmltree "$apk" --file AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          grep -A1 'io.flutter.embedding.android.EnableImpeller' "$RUNNER_TEMP/manifest.txt" | grep '0xffffffff' > /dev/null
          if unzip -l "$apk" | grep -E 'libonnxruntime|assets/models/' > /dev/null; then
            echo "::error::standard 包含有 3D 资产（flavor 隔离失效）"; exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MD3音乐-${{ env.FLAVOR_CN }}-${{ inputs.build_type }}
          path: build/app/outputs/flutter-apk/${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 7
