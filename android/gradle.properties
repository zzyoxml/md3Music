org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.jvm=false
kotlin.caching.enabled=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.sdk.dir=C:/Android/Sdk
# 保留资源原名：桌面快捷方式图标通过 getIdentifier("ic_shortcut_*", "drawable", pkg)
# 字符串查找，AGP 资源名混淆会把 drawable 重命名为短名（如 res/a.xml），
# 导致运行时按原名找不到图标。关闭资源优化（保留 shrinkResources 删除功能，
# 图标由 res/raw/keep.xml 的 tools:keep 兜底保留）。
android.enableResourceOptimizations=false
